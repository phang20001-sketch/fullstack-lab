spring: # Spring Boot 开发环境配置根节点
  config: # 当前配置文件的激活条件
    activate: # 环境激活配置
      on-profile: dev # 仅在启用 dev Profile 时加载本文件

  datasource: # PostgreSQL 数据源配置
    url: jdbc:postgresql://127.0.0.1:5432/fullstack_lab # JDBC 地址；开发环境连接本机 PostgreSQL 的 fullstack_lab 数据库
    username: postgres # PostgreSQL 登录用户名
    password: postgres # PostgreSQL 登录密码
    druid: # Druid 开发环境连接池参数
      initial-size: 2 # 应用启动时初始化 2 个数据库连接
      min-idle: 2 # 连接池保持至少 2 个空闲连接
      max-active: 10 # 连接池最多允许 10 个活动连接
      max-wait: 10000 # 获取连接时最长等待 10000 毫秒，即 10 秒
      validation-query: SELECT 1 # 用于检测 PostgreSQL 连接是否可用的轻量 SQL
      validation-query-timeout: 3 # 连接检测 SQL 的超时时间，单位秒
      test-while-idle: true # 空闲连接巡检时执行连接有效性检测
      test-on-borrow: false # 借出连接前不逐次检测，以减少请求开销
      test-on-return: false # 归还连接时不逐次检测，以减少请求开销
      keep-alive: true # 对长期空闲连接执行保活，降低连接被网络设备断开的概率
      time-between-eviction-runs-millis: 60000 # 空闲连接检测线程的运行间隔，单位毫秒，此处为 1 分钟
      min-evictable-idle-time-millis: 300000 # 连接至少空闲多久后可被回收，单位毫秒，此处为 5 分钟
      pool-prepared-statements: true # 缓存数据库预编译语句 PreparedStatement
      max-pool-prepared-statement-per-connection-size: 20 # 每个数据库连接最多缓存 20 条预编译语句
      filter: # Druid 内置过滤器配置
        stat: # SQL 统计与慢 SQL 过滤器
          enabled: true # 开启 SQL 执行统计
          log-slow-sql: true # 将超过阈值的慢 SQL 写入日志
          slow-sql-millis: 2000 # 慢 SQL 判定阈值，单位毫秒，此处为 2 秒
      stat-view-servlet: # Druid 浏览器监控控制台配置
        enabled: false # 关闭 Druid 监控控制台，避免未授权访问
      web-stat-filter: # Druid Web 请求与 SQL 关联统计配置
        enabled: false # 关闭 Web 统计过滤器，减少额外开销

  flyway: # Flyway 数据库版本迁移配置
    enabled: true # 启动应用时自动执行尚未执行的数据库迁移脚本
    clean-disabled: true # 禁止执行 clean 清库操作，防止误删数据
    validate-on-migrate: true # 迁移前校验已执行脚本的校验和是否发生变化

  data: # Spring 数据组件配置
    redis: # Redisson Starter 读取的 Redis 连接配置
      host: 127.0.0.1 # Redis 主机；开发环境连接本机
      port: 6379 # Redis 服务端口
      database: 0 # Redis 逻辑库编号；使用 0 号库
      password: "" # Redis 登录密码；本机开发环境使用空密码
      connect-timeout: 3s # 建立 Redis TCP 连接的最长等待时间
      timeout: 3s # Redis 命令读写响应的最长等待时间

  rabbitmq: # RabbitMQ 连接与消息可靠性配置
    host: 127.0.0.1 # RabbitMQ 主机；开发环境连接本机
    port: 5672 # RabbitMQ AMQP 服务端口
    username: guest # RabbitMQ 登录用户名；guest 仅用于本机开发
    password: guest # RabbitMQ 登录密码
    virtual-host: / # RabbitMQ 虚拟主机；使用根虚拟主机
    connection-timeout: 5s # 建立 RabbitMQ 连接的最长等待时间
    requested-heartbeat: 30s # 客户端请求的 AMQP 心跳间隔，用于及时发现断线
    publisher-confirm-type: correlated # 开启带 CorrelationData 的发布确认，用于关联每条消息的 Broker 确认结果
    publisher-returns: true # 消息无法路由到队列时将消息退回给生产者

management: # 开发环境 Actuator 配置
  endpoint: # 单个监控端点配置
    health: # 健康检查端点配置
      show-details: always # 开发环境始终显示数据库、Redis、RabbitMQ 等详细健康信息

logging: # 日志配置
  level: # 各包的日志级别
    com.example.fullstacklab: DEBUG # 项目自身代码输出 DEBUG 及以上级别日志，便于开发排查
